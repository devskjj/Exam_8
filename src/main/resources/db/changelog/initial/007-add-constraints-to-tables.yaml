databaseChangeLog:
  - changeSet:
      id: 007-add-constraints-to-tables
      author: admin
      changes:
        - addForeignKeyConstraint:
            constraintName: fk_role_id
            baseTableName: users
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_user_id
            baseTableName: files
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_file_category_id
            baseTableName: files
            baseColumnNames: file_category_id
            referencedTableName: file_categories
            referencedColumnNames: id
            onDelete: RESTRICT
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_content_type_id
            baseTableName: files
            baseColumnNames: content_type_id
            referencedTableName: content_types
            referencedColumnNames: id
            onDelete: RESTRICT
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_file_id
            baseTableName: download_tokens
            baseColumnNames: file_id
            referencedTableName: files
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE