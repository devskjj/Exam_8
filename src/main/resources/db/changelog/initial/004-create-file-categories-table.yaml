databaseChangeLog:
  - changeSet:
      id: 004-create-file-categories-table
      author: Denis
      changes:
        - createTable:
            tableName: file_categories
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)