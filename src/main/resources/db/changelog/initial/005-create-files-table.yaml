databaseChangeLog:
  - changeSet:
      id: 005-create-files-table
      author: Denis
      changes:
        - createTable:
            tableName: files
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: size
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: upload_date
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: file_category_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: content_type_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: is_public
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: path_name
                  type: VARCHAR(500)
                  constraints:
                    nullable: true
              - column:
                  name: download_count
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false